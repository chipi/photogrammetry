# The site name lives here only.
site_name: Recce
site_description: Recce, an open-source photogrammetry reconstruction engine; concept package, reference docs and working notes.
site_url: https://chipi.github.io/recce/
repo_url: https://github.com/chipi/recce
repo_name: chipi/recce
edit_uri: edit/main/docs/
copyright: MIT, Marko Mrdjenovic and contributors
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Concept:
      - concept/index.md
      - Brief: concept/RC-brief.md
      - Architecture sketch: concept/RC-architecture-sketch.md
      - Use cases: concept/RC-use-cases.md
  - Reference:
      - reference/index.md
      - Photogrammetry primer: reference/photogrammetry-primer.md
      - Tools overview: reference/tools-overview.md
      - Product feature analysis: reference/product-feature-analysis.md
      - Public datasets: reference/public-datasets.md
  - Licensing: LICENSING.md
  - Working notes:
      - wip/index.md
      - Hardware and parallelism: wip/hardware-and-parallelism.md
      - Step 0 status and findings: wip/step0-status.md
      - GPU rental for RC-P7: wip/gpu-rental-p7.md
      - Underwater benchmark spec: wip/underwater-benchmark-spec.md
      - Robotics-lab contract: wip/robotics-lab-contract.md
      - Research, landscape: wip/research-landscape-2026-11-23.md
      - Research, Metashape and underwater: wip/research-metashape-underwater-2026-11-23.md
      - Review of the concept-phase start: wip/review-fable-2026-11-23.md
      - Capture-set amendments: wip/capture-set-amendments.md
      - Verification of open facts: wip/verification-2026-11-24.md
      - Visual ideas: wip/visual-ideas.md
      - Research, UX inspiration: wip/research-ux-inspiration-2026-11-24.md
      - Research, drone and phone datasets: wip/research-drone-phone-datasets-2026-11-26.md
      - Gap list as an interface: wip/gap-list-interface.md
